name: Refresh ramen prices
# Replaced on the schedule by menus.yml; this scan stays available by hand.
on:
  workflow_dispatch:
    inputs:
      city:
        description: City (the schedule runs Zürich, Basel and Bern)
        type: choice
        options: [zurich, basel, bern, lausanne, geneva, winterthur, olten]
        default: zurich
      ai_budget_usd:
        description: Haiku 5.5 API budget in USD (hard cap 1.00)
        type: number
        default: 1
permissions:
  contents: write
concurrency:
  # Shared queue for all category scans: they run one after another and never publish at the same time.
  # Each scan has its own queue; scraper.publish merges concurrent results per file on top of the newest branch tip.
  group: menu-prices
  # Keep every requested run waiting in order; without this GitHub cancels all but the newest pending run.
  queue: max
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # One job per city; publishing merges per file. Other cities only by hand.
      matrix:
        city: ${{ fromJSON(github.event_name == 'schedule' && '["zurich","basel","bern"]' || format('["{0}"]', inputs.city || 'zurich')) }}
    env:
      WOBILLIG_CITY: ${{ matrix.city }}
    steps:
      - name: Check three-week refresh cadence
        id: cadence
        shell: python
        run: |
          import os
          from datetime import date, datetime, timezone

          anchor = date(2026, 10, 19)
          today = datetime.now(timezone.utc).date()
          due = today >= anchor and (today - anchor).days % 21 == 0
          refresh = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or due
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'refresh={str(refresh).lower()}\n')
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.refresh == 'true'
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.refresh == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - if: steps.cadence.outputs.refresh == 'true'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr && pip install -r scraper/requirements.txt
      - name: Test ramen rules
        if: steps.cadence.outputs.refresh == 'true'
        run: python -m unittest discover -s tests -p 'test_ramen.py'
      - name: Crawl ramen menus and confirm prices with Claude
        if: steps.cadence.outputs.refresh == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ inputs.ai_budget_usd || 1 }}
        run: python -m scraper.ramen --budget-usd "$BUDGET"
      - name: Snapshot ramen dataset
        id: snapshot
        if: steps.cadence.outputs.refresh == 'true'
        run: python -m scraper.publish --snapshot "$RUNNER_TEMP/ramen-snapshot.json"
      - name: Save ramen dataset
        if: steps.snapshot.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m scraper.publish --snapshot "$RUNNER_TEMP/ramen-snapshot.json" --branch "$GITHUB_REF_NAME"
