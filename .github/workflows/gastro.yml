name: Refresh cocktail, soft drink and bread prices

# Restaurants and bars, read from their websites and confirmed by Claude Haiku 5.5. Runs every three weeks
# with the deep scan: Zürich with all three categories at 3 USD each, Basel and Bern with cocktails and
# soft drinks at 1.50 USD each (bread is not shown in the app). By hand for one category and one city.

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      category:
        description: Which price scan to run by hand
        type: choice
        options: [cocktail, softdrink, brot]
        default: cocktail
      city:
        description: City (bread only in Zürich)
        type: choice
        options: [zurich, basel, bern]
        default: zurich
      ai_budget_usd:
        description: Haiku 5.5 API budget in USD per category (empty uses 3 in Zürich and 1.50 in Basel and Bern, like the scheduled runs)
        type: string
        default: ""
      tief:
        description: Deep scan, more pages and documents per venue
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Shared queue for all category scans: runs wait for each other. The city jobs of one run publish
  # independently; scraper.publish retries on top of the newest branch tip.
  group: category-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      # One job per city, so each city keeps its own time limit. Publishing merges per file.
      matrix:
        city: ${{ fromJSON(github.event_name == 'schedule' && '["zurich","basel","bern"]' || format('["{0}"]', inputs.city || 'zurich')) }}
    env:
      WOBILLIG_CITY: ${{ matrix.city }}
    steps:
      - name: Check three-week refresh cadence
        id: cadence
        shell: python
        run: |
          import os
          from datetime import date, datetime, timezone

          anchor = date(2026, 10, 19)
          today = datetime.now(timezone.utc).date()
          due = today >= anchor and (today - anchor).days % 21 == 0
          refresh = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or due
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'refresh={str(refresh).lower()}\n')

      - uses: actions/checkout@v4
        if: steps.cadence.outputs.refresh == 'true'
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.refresh == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - if: steps.cadence.outputs.refresh == 'true'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr && pip install -r scraper/requirements.txt

      - name: Test gastro rules
        if: steps.cadence.outputs.refresh == 'true'
        run: python -m unittest discover -s tests -p 'test_gastro.py'

      - name: Crawl restaurant and bar websites and confirm prices with Claude
        if: steps.cadence.outputs.refresh == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVENT: ${{ github.event_name }}
          CATEGORY: ${{ inputs.category }}
          BUDGET: ${{ inputs.ai_budget_usd }}
          TIEF: ${{ github.event_name == 'schedule' || inputs.tief }}
        run: |
          FLAG=""
          if [ "$TIEF" = "true" ]; then FLAG="--tief"; fi
          if [ "$EVENT" = "schedule" ]; then
            # Zürich: three categories share the job limit with 110 minutes each. Basel and Bern: two with 150.
            if [ "$WOBILLIG_CITY" = "zurich" ]; then CATS="cocktail softdrink brot"; BUDGET=3; MINUTES=110
            else CATS="cocktail softdrink"; BUDGET=1.5; MINUTES=150; fi
          else
            if [ "$CATEGORY" = "brot" ] && [ "$WOBILLIG_CITY" != "zurich" ]; then
              echo "::error::Bread in restaurants is scanned only in Zürich."; exit 1
            fi
            CATS="$CATEGORY"; MINUTES=300
            if [ -z "$BUDGET" ]; then BUDGET=$([ "$WOBILLIG_CITY" = "zurich" ] && echo 3 || echo 1.5); fi
          fi
          for c in $CATS; do
            python -m scraper.gastro --category "$c" --budget-usd "$BUDGET" --minutes "$MINUTES" $FLAG
          done

      - name: Snapshot gastro datasets
        id: snapshot
        if: steps.cadence.outputs.refresh == 'true'
        run: python -m scraper.publish --snapshot "$RUNNER_TEMP/gastro-snapshot.json"

      - name: Save gastro datasets
        if: steps.cadence.outputs.refresh == 'true' && steps.snapshot.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m scraper.publish --snapshot "$RUNNER_TEMP/gastro-snapshot.json" --branch "$GITHUB_REF_NAME"
