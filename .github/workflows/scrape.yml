name: Refresh city prices
run-name: "City prices · ${{ inputs.city || 'all' }} · ${{ (github.event_name == 'schedule' || inputs.deep_scan) && 'deep scan' || inputs.scan_mode || 'scheduled refresh' }}"
on:
  schedule:
    # The cadence job runs every third Monday to keep a true 21-day interval.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      city:
        description: City to refresh (all runs the three cities in sequence)
        type: choice
        options: [all, zurich, bern, basel]
        default: all
      scan_mode:
        description: Scan mode
        type: choice
        options: [full, ai_only, estimates_only, photos_only]
        default: full
      ai_budget_usd:
        description: Total Haiku 5.5 API cost across selected cities in USD (normal cap 1.00, deep scan cap 10.00)
        type: number
        default: 1.00
      ai_max_requests:
        description: Total Claude generations across selected cities (hard cap 1000)
        type: number
        default: 1000
      deep_scan:
        description: Extended scan (default; all candidates, up to 50 menu pages per venue)
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: drink-data-refresh
  cancel-in-progress: false
jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.check.outputs.refresh }}
    steps:
      - name: Check three-week refresh cadence
        id: check
        shell: python
        run: |
          import os
          from datetime import date, datetime, timezone

          anchor = date(2026, 10, 19)
          today = datetime.now(timezone.utc).date()
          due = today >= anchor and (today - anchor).days % 21 == 0
          refresh = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or due
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'refresh={str(refresh).lower()}\n')
  scrape:
    name: ${{ matrix.city }}
    needs: cadence
    if: ${{ needs.cadence.outputs.refresh == 'true' }}
    strategy:
      fail-fast: false
      # Keep publication and shared-host crawling serial across cities.
      max-parallel: 1
      matrix:
        city: ${{ fromJSON(inputs.city == 'zurich' && '["zurich"]' || inputs.city == 'bern' && '["bern"]' || inputs.city == 'basel' && '["basel"]' || '["zurich","bern","basel"]') }}
    uses: ./.github/workflows/scrape-city.yml
    with:
      city: ${{ matrix.city }}
      city_count: ${{ inputs.city && inputs.city != 'all' && 1 || 3 }}
      scan_mode: ${{ inputs.scan_mode || 'full' }}
      deep_scan: ${{ github.event_name == 'schedule' || inputs.deep_scan }}
      ai_budget_usd: ${{ github.event_name == 'schedule' && 1 || inputs.ai_budget_usd || 0 }}
      ai_max_requests: ${{ github.event_name == 'schedule' && 1000 || inputs.ai_max_requests || 0 }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
