name: Refresh Zurich beer prices
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: beer-data-refresh
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m scraper.scrape --discover
      - run: python -m scraper.enrich --limit 200
      - name: Save refreshed dataset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/bars.json scraper/discovery_checks.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Zurich bars and beer prices"
            git push
          fi
