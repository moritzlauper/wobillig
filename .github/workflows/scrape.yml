name: Refresh city prices
run-name: "${{ inputs.scan_mode == 'pizza_only' && 'Pizza menus' || 'City prices' }} · ${{ inputs.city || 'all' }} · ${{ inputs.exhaustive_scan && 'extra-deep scan' || (github.event_name == 'schedule' || inputs.deep_scan) && 'deep scan' || inputs.scan_mode || 'scheduled refresh' }}"
on:
  schedule:
    # The cadence job runs every third Monday to keep a true 21-day interval.
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      city:
        description: City to refresh (all runs the seven cities in sequence)
        type: choice
        options: [all, zurich, bern, basel, lausanne, geneva, winterthur, olten]
        default: all
      scan_mode:
        description: Scan mode
        type: choice
        options: [full, pizza_only, ai_only, estimates_only, photos_only]
        default: full
      ai_budget_usd:
        description: Haiku 5.5 API budget per city in USD (default 5.00, hard cap 20.00; no request cap)
        type: number
        default: 5.00
      exhaustive_scan:
        description: Extra-deep manual scan (120 menu pages, 60 AI documents per venue)
        type: boolean
        default: false
      deep_scan:
        description: Extended scan (default; all candidates, up to 50 menu pages per venue)
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: drink-data-refresh
  # Keep separately requested city runs in FIFO order instead of replacing pending runs.
  queue: max
  cancel-in-progress: false
jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.check.outputs.refresh }}
    steps:
      - name: Check three-week refresh cadence
        id: check
        shell: python
        run: |
          import os
          from datetime import date, datetime, timezone

          anchor = date(2026, 10, 19)
          today = datetime.now(timezone.utc).date()
          due = today >= anchor and (today - anchor).days % 21 == 0
          refresh = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or due
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'refresh={str(refresh).lower()}\n')
  zurich:
    name: Zürich
    needs: cadence
    if: ${{ !cancelled() && needs.cadence.outputs.refresh == 'true' && (github.event_name == 'schedule' || inputs.city == 'all' || inputs.city == 'zurich') }}
    uses: ./.github/workflows/scrape-city.yml
    with:
      city: zurich
      # Each city has its own budget; do not divide it across the city jobs.
      city_count: 1
      scan_mode: ${{ inputs.scan_mode || 'full' }}
      exhaustive_scan: ${{ inputs.exhaustive_scan || false }}
      deep_scan: ${{ github.event_name == 'schedule' || inputs.deep_scan || inputs.exhaustive_scan }}
      ai_budget_usd: ${{ fromJSON(format('{0}', github.event_name == 'schedule' && 5 || inputs.ai_budget_usd || 0)) }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  basel:
    name: Basel
    needs: [cadence, zurich]
    if: ${{ !cancelled() && needs.cadence.outputs.refresh == 'true' && (github.event_name == 'schedule' || inputs.city == 'all' || inputs.city == 'basel') }}
    uses: ./.github/workflows/scrape-city.yml
    with:
