name: Refresh burger prices
on:
  workflow_dispatch:
    inputs:
      ai_budget_usd:
        description: Haiku 5.5 API budget in USD for all restaurant menus (hard cap 20.00)
        type: number
        default: 5
permissions:
  contents: write
concurrency:
  # Shared queue for all category scans: they run one after another and never publish at the same time.
  group: category-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr && pip install -r scraper/requirements.txt
      - name: Test burger rules
        run: python -m unittest discover -s tests -p 'test_burger.py'
      - name: Crawl burger menus and confirm prices with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ inputs.ai_budget_usd || 5 }}
        run: python -m scraper.burger --budget-usd "$BUDGET"
      - name: Snapshot burger dataset
        id: snapshot
        run: python -m scraper.publish --snapshot "$RUNNER_TEMP/burger-snapshot.json"
      - name: Save burger dataset
        if: steps.snapshot.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m scraper.publish --snapshot "$RUNNER_TEMP/burger-snapshot.json" --branch "$GITHUB_REF_NAME"
