name: Refresh bread prices

on:
  schedule:
    # Same three-week cadence as the city price scan, so all Zürich datasets share one observation window.
    - cron: "53 6 * * 1"
  workflow_dispatch:
    inputs:
      ai_budget_usd:
        description: Haiku 5.5 API budget in USD (hard cap 2.00)
        type: number
        default: 2
permissions:
  contents: write
concurrency:
  # Shared queue for all category scans: they run one after another and never publish at the same time.
  group: category-prices
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check three-week refresh cadence
        id: cadence
        shell: python
        run: |
          import os
          from datetime import date, datetime, timezone

          anchor = date(2026, 10, 19)
          today = datetime.now(timezone.utc).date()
          due = today >= anchor and (today - anchor).days % 21 == 0
          refresh = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or due
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'refresh={str(refresh).lower()}\n')
      - uses: actions/checkout@v4
        if: steps.cadence.outputs.refresh == 'true'
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.cadence.outputs.refresh == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - if: steps.cadence.outputs.refresh == 'true'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr && pip install -r scraper/requirements.txt
      - name: Test bread rules
        if: steps.cadence.outputs.refresh == 'true'
        run: python -m unittest discover -s tests -p 'test_brot.py'
      - name: Crawl bakeries and confirm bread prices with Claude
        if: steps.cadence.outputs.refresh == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUDGET: ${{ inputs.ai_budget_usd || 2 }}
        run: python -m scraper.brot --budget-usd "$BUDGET"
      - name: Snapshot bread dataset
        id: snapshot
        if: steps.cadence.outputs.refresh == 'true'
        run: python -m scraper.publish --snapshot "$RUNNER_TEMP/brot-snapshot.json"
      - name: Save bread dataset
        if: steps.snapshot.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m scraper.publish --snapshot "$RUNNER_TEMP/brot-snapshot.json" --branch "$GITHUB_REF_NAME"
