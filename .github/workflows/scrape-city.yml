name: Refresh one city
on:
  workflow_call:
    inputs:
      city:
        type: string
        required: true
      city_count:
        type: number
        required: true
      scan_mode:
        type: string
        required: true
      exhaustive_scan:
        type: boolean
        default: false
      deep_scan:
        type: boolean
        required: true
      ai_budget_usd:
        type: number
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false
permissions:
  contents: write
jobs:
  drinks:
    name: Beer and coffee
    if: ${{ inputs.scan_mode == 'full' }}
    uses: ./.github/workflows/scrape-stage.yml
    with:
      stage: drinks
      city: ${{ inputs.city }}
      city_count: ${{ inputs.city_count }}
      scan_mode: ${{ inputs.scan_mode }}
      exhaustive_scan: ${{ inputs.exhaustive_scan }}
      deep_scan: ${{ inputs.deep_scan }}
      ai_budget_usd: ${{ inputs.ai_budget_usd }}
  pizza:
    name: Pizza
    needs: drinks
    if: ${{ !cancelled() && inputs.scan_mode == 'full' }}
    uses: ./.github/workflows/scrape-stage.yml
    with:
      stage: pizza
      city: ${{ inputs.city }}
      city_count: ${{ inputs.city_count }}
      scan_mode: ${{ inputs.scan_mode }}
      exhaustive_scan: ${{ inputs.exhaustive_scan }}
      deep_scan: ${{ inputs.deep_scan }}
      ai_budget_usd: ${{ inputs.ai_budget_usd }}
  doner:
    name: Döner
    needs: pizza
    if: ${{ !cancelled() && (inputs.scan_mode == 'full' || inputs.scan_mode == 'streetfood_only') }}
    uses: ./.github/workflows/scrape-stage.yml
    with:
      stage: doner
      city: ${{ inputs.city }}
      city_count: ${{ inputs.city_count }}
      scan_mode: ${{ inputs.scan_mode }}
      exhaustive_scan: ${{ inputs.exhaustive_scan }}
      deep_scan: ${{ inputs.deep_scan }}
      ai_budget_usd: 0
  falafel:
    name: Falafel
    needs: doner
    if: ${{ !cancelled() && (inputs.scan_mode == 'full' || inputs.scan_mode == 'streetfood_only') }}
    uses: ./.github/workflows/scrape-stage.yml
    with:
      stage: falafel
      city: ${{ inputs.city }}
      city_count: ${{ inputs.city_count }}
      scan_mode: ${{ inputs.scan_mode }}
      exhaustive_scan: ${{ inputs.exhaustive_scan }}
      deep_scan: ${{ inputs.deep_scan }}
      ai_budget_usd: 0
  ai:
    name: Claude menus and serving formats
    needs: [drinks, pizza, doner, falafel]
    if: ${{ !cancelled() && inputs.scan_mode != 'streetfood_only' }}
    uses: ./.github/workflows/scrape-stage.yml
    with:
      stage: ai
      city: ${{ inputs.city }}
      city_count: ${{ inputs.city_count }}
      scan_mode: ${{ inputs.scan_mode }}
      exhaustive_scan: ${{ inputs.exhaustive_scan }}
      deep_scan: ${{ inputs.deep_scan }}
      ai_budget_usd: ${{ inputs.ai_budget_usd }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
