name: Kino Zürich

# Sucht die Eintrittspreise der Zürcher Kinos auf deren Websites (scripts/kino-preise.mjs) und vergleicht
# sie. Läuft alle drei Wochen (Montag) und von Hand, geplante Läufe immer mit tiefem Scan. Ergebnis:
# Vergleich in der Zusammenfassung des Laufs, Rohdaten als Artefakt "kinopreise". Kein Commit zurück auf main.

on:
  schedule:
    - cron: "8 6 * * 1"
  workflow_dispatch:
    inputs:
      ki_budget_usd:
        description: Haiku 5.5 budget in USD for reading the cinema pages (0 reads only by regex; scheduled runs use 2)
        type: number
        default: 2
      tief:
        description: Deep scan, up to sixty pages per cinema instead of three (scheduled runs always use it)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kino-preise
  cancel-in-progress: false

jobs:
  preise:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check three-week refresh cadence
        id: cadence
        shell: python
        run: |
          import os
          from datetime import date, datetime, timezone

          anchor = date(2026, 10, 19)
          today = datetime.now(timezone.utc).date()
          due = today >= anchor and (today - anchor).days % 21 == 0
          refresh = os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' or due
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'refresh={str(refresh).lower()}\n')

      - uses: actions/checkout@v4
        if: steps.cadence.outputs.refresh == 'true'

      - uses: actions/setup-node@v4
        if: steps.cadence.outputs.refresh == 'true'
        with:
          node-version: 22

      - name: Skript testen
        if: steps.cadence.outputs.refresh == 'true'
        run: node --test tests/kino-preise.node.mjs

      - name: Preise suchen und vergleichen
        if: steps.cadence.outputs.refresh == 'true'
        env:
          # Optional. Ohne Secret oder mit Budget 0 liest der Lauf die Preise nur per Regex aus der Seite.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KI_BUDGET_USD: ${{ github.event_name == 'schedule' && 2 || inputs.ki_budget_usd }}
          KINO_TIEFE: ${{ (github.event_name == 'schedule' || inputs.tief) && 'tief' || 'normal' }}
        run: node scripts/kino-preise.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Rohdaten als Artefakt ablegen
        if: always() && steps.cadence.outputs.refresh == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kinopreise
          path: scripts/kino-zuerich.json
          retention-days: 90
