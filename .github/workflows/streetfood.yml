name: Refresh döner and falafel prices

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared queue for all category scans: they run one after another and never publish at the same time.
  group: category-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr && pip install -r scraper/requirements.txt

      - name: Test street-food rules
        run: python -m unittest discover -s tests -p 'test_streetfood.py'

      - name: Crawl döner menus in Zürich
        run: python -m scraper.scrape_streetfood --category doner --discover --limit 0 --max-pages 120

      - name: Crawl falafel menus in Zürich
        run: python -m scraper.scrape_streetfood --category falafel --discover --limit 0 --max-pages 120

      - name: Snapshot street-food datasets
        id: snapshot
        run: python -m scraper.publish --snapshot "$RUNNER_TEMP/streetfood-snapshot.json"

      - name: Save street-food datasets
        if: steps.snapshot.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m scraper.publish --snapshot "$RUNNER_TEMP/streetfood-snapshot.json" --branch "$GITHUB_REF_NAME"
